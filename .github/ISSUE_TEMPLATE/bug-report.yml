name: Bug report
description: Report a reproducible Aava problem.
body:
  - type: markdown
    attributes:
      value: "Please keep passwords, cookies, tokens, browsing history and personal profile files out of reports."
  - type: input
    id: version
    attributes:
      label: Aava version and macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or sanitized log
      description: Remove personal information before attaching.
