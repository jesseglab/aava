name: Core tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        run: swift test
      - name: Python script syntax
        run: python3 -m compileall -q scripts
