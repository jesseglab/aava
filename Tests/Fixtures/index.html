<!doctype html><html lang="en"><meta charset="utf-8"><title>Aava browser checks</title><style>body{font:17px system-ui;max-width:680px;margin:70px auto;padding:24px;background:#f5f6f0;color:#294b4d}input,textarea,button{font:inherit;padding:12px;margin:8px 0}label{display:block}textarea{width:100%}button{cursor:pointer}</style><h1>Aava browser checks</h1><p>This local page tests profiles, navigation and native input. It sends no data to external services.</p><label>Profile note <input id="note" aria-label="Profile note"></label><button id="store">Store in this profile</button><p id="result"></p><label>Unsaved draft<textarea id="draft" aria-label="Unsaved draft"></textarea></label><button id="saved">Mark draft saved</button><p><a href="second.html">Navigate to second page</a></p><button onclick="window.open('second.html','_blank','width=560,height=400')">Open popup</button><script>const note=document.querySelector('#note'),result=document.querySelector('#result');function show(){result.textContent='Stored note: '+(localStorage.getItem('aava-check')||'empty')+' · Cookie: '+(document.cookie||'empty')}show();document.querySelector('#store').onclick=()=>{localStorage.setItem('aava-check',note.value);document.cookie='aava_check='+encodeURIComponent(note.value)+'; SameSite=Lax; path=/';show()};let dirty=false;document.querySelector('#draft').oninput=()=>dirty=true;document.querySelector('#saved').onclick=()=>dirty=false;addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}})</script></html>
